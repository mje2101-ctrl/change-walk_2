<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Change Walk: Self-Assessment for Two</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FFFFFF; --surface:#F1F1F1; --ink:#1E2328; --muted:#5F666D; --line:#D0D5DA;
  --blue:#0071B9; --navy:#00558C; --barbg:#0071B9;
  --mgmt:#7F7F7F; --mgmt-bg:#F1F1F1; --lead:#74ADD7; --lead-bg:#E6F1F8;
  --chipM:#7F7F7F; --chipL:#00558C;
  --a:#0B5CA8; --on-a:#FFFFFF; --b:#C2610A; --on-b:#FFFFFF;
  --warn-bg:#FFF4DC; --warn-ink:#6B4600;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161C; --surface:#1A222A; --ink:#E8EEF3; --muted:#9AA8B5; --line:#2D3B49;
    --blue:#6DB6EA; --navy:#9CCBF0; --barbg:#00558C;
    --mgmt:#9AA0A6; --mgmt-bg:#20272E; --lead:#6DB6EA; --lead-bg:#16293A;
    --chipM:#6B7076; --chipL:#1F6FA8;
    --a:#7DB8EA; --on-a:#0A1A2A; --b:#F2A65A; --on-b:#2A1500;
    --warn-bg:#3A2D10; --warn-ink:#F5D99A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161C; --surface:#1A222A; --ink:#E8EEF3; --muted:#9AA8B5; --line:#2D3B49;
  --blue:#6DB6EA; --navy:#9CCBF0; --barbg:#00558C;
  --mgmt:#9AA0A6; --mgmt-bg:#20272E; --lead:#6DB6EA; --lead-bg:#16293A;
  --chipM:#6B7076; --chipL:#1F6FA8;
  --a:#7DB8EA; --on-a:#0A1A2A; --b:#F2A65A; --on-b:#2A1500;
  --warn-bg:#3A2D10; --warn-ink:#F5D99A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:var(--bg);color:var(--ink);
  font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;
  font-size:16px;line-height:1.45;
  -webkit-text-size-adjust:100%;
}
#app{min-height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}

.band{
  background:var(--pc);color:var(--on-pc);
  padding:12px 20px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.band .who{font-weight:bold;font-size:24px;line-height:1.1}
.band .sub{font-size:13px;opacity:.9}
.band .round{font-size:14px;text-align:right;white-space:nowrap}
.progress{height:4px;background:var(--line)}
.progress i{display:block;height:100%;background:var(--pc);transition:width .3s}

main{flex:1;padding:20px 20px 24px}
h1,h2,h3{font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;margin:0}
h1{font-size:30px;line-height:1.15;font-weight:400;color:var(--blue);margin-bottom:6px}
h2{font-size:26px;line-height:1.15;font-weight:400;color:var(--blue);margin-bottom:6px}
h3{font-size:17px;font-weight:bold;margin-bottom:4px}
p{margin:0 0 12px}
.muted{color:var(--muted);font-size:15px}
.small{font-size:13px;color:var(--muted)}

/* serif "change" lock-up as on the slides */
.lockup em,.tag em{display:block;font-family:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;font-style:italic;font-weight:400;font-size:30px;line-height:1;color:var(--ink)}
.lockup span,.tag span{display:block;font-family:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;font-size:23px;line-height:1.15;letter-spacing:.01em;color:var(--ink)}
.lockup small{display:block;font-size:15px;margin-top:2px;color:var(--ink)}
.world{padding:14px 16px;margin-top:10px}
.world.m{background:var(--mgmt-bg)} .world.l{background:var(--lead-bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips b{padding:7px 12px;color:#fff;font-size:14px}
.world.m .chips b{background:var(--chipM)} .world.l .chips b{background:var(--chipL)}

label.field{display:block;margin:14px 0 0;font-size:15px;color:var(--muted)}
.field input{
  display:block;width:100%;margin-top:6px;padding:13px 14px;font-size:18px;font-family:inherit;
  border:2px solid var(--line);border-radius:0;background:var(--bg);color:var(--ink);
}
.field input:focus{outline:3px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}

button{font:inherit;cursor:pointer}
.btn{
  display:block;width:100%;padding:15px;margin-top:18px;border:0;border-radius:0;
  background:var(--blue);color:#fff;font-size:17px;font-weight:bold;
}
:root[data-theme="dark"] .btn{color:#0A1A2A}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn{color:#0A1A2A} }
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--blue);border:2px solid var(--blue)}
.btn.pc{background:var(--pc);color:var(--on-pc)}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.card{padding:16px;margin-top:12px}
.card.m{background:var(--mgmt-bg)}
.card.l{background:var(--lead-bg)}
.tag{margin-bottom:10px}
.stmt{font-size:17px;margin-bottom:12px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{
  padding:13px 0;border-radius:0;border:2px solid var(--line);background:var(--bg);color:var(--ink);
  font-size:18px;font-weight:bold;
}
.scale button[aria-pressed="true"]{background:var(--pc);border-color:var(--pc);color:var(--on-pc)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.topic{font-size:15px;color:var(--muted);margin-bottom:2px}

.handover{
  flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  padding:32px 24px;background:var(--pc);color:var(--on-pc);
}
.handover .big{font-weight:bold;font-size:40px;line-height:1.1;margin:10px 0 18px;word-break:break-word}
.handover .btn{background:var(--on-pc);color:var(--pc);max-width:360px}
.handover p{font-size:18px;max-width:340px}

.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.pill{display:inline-block;min-width:34px;text-align:center;padding:4px 10px;border-radius:999px;font-weight:bold}
.pill.a{background:var(--a);color:var(--on-a)}
.pill.b{background:var(--b);color:var(--on-b)}
.gap{background:var(--warn-bg);color:var(--warn-ink);padding:8px 12px;font-size:14px;margin-top:6px}
.prompt{background:var(--lead-bg);padding:14px 16px;margin-top:18px}
.prompt b{color:var(--blue)}

.person{border-top:6px solid var(--pc);background:var(--surface);padding:16px;margin-top:16px}
.person h3{color:var(--pc);font-size:20px}
.bar{margin:10px 0}
.bar .lab{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.bar .track{height:12px;background:var(--bg);overflow:hidden}
.bar .fill{height:100%}
.fill.m{background:var(--chipM)} .fill.l{background:var(--chipL)}
.sep{border:0;border-top:1px solid var(--line);margin:22px 0}
ul.clean{margin:6px 0 0;padding-left:20px}
ul.clean li{margin-bottom:6px}
.note{background:var(--surface);padding:12px 14px;font-size:14px;color:var(--muted);margin-top:18px}
.balance{background:var(--barbg);color:#fff;font-weight:bold;font-size:14px;text-align:center;padding:12px 16px}
.foot{display:flex;justify-content:space-between;gap:10px;padding:10px 20px 16px;font-size:13px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px 0}

.brandtop{background:#FFFFFF;display:flex;justify-content:flex-end;align-items:center;padding:8px 16px;min-height:52px}
.brandtop img{height:38px;width:auto;display:block}
.brandbot{background:#FFFFFF;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px}
.brandbot img{height:30px;width:auto;display:block}
.brandbot .link{color:#5B6874}
.body{flex:1;display:flex;flex-direction:column}
.anchor{background:var(--surface);padding:10px 14px;margin-bottom:12px;font-size:15px}
@media (prefers-reduced-motion: reduce){ .progress i{transition:none} }
</style>
</head>

  function foot(){ return ''; }
  var BAL = '<div class="balance">Balance between the two worlds for effective change</div>';

  function tagHtml(k){ return '<div class="tag"><em>change</em><span>' + (k==="m"?"MANAGEMENT":"LEADERSHIP") + '</span></div>'; }

  function band(p, sub, right, pct){
    return '<div style="' + pcStyle(p) + '">' +
      '<div class="band"><div><div class="sub">' + sub + '</div><div class="who">' + esc(nm(p)) + '</div></div>' +
      '<div class="round">' + right + '</div></div>' +
      '<div class="progress"><i style="width:' + pct + '%"></i></div></div>';
  }

  function viewIntro(){
    return '<main>' +
      '<h1>The two worlds of change</h1>' +
      '<div class="world m"><div class="lockup"><em>change</em><span>MANAGEMENT</span><small>- the obvious</small></div><div class="chips"><b>Tools</b><b>Practices</b><b>Processes</b><b>Templates</b></div></div>' +
      '<div class="world l"><div class="lockup"><em>change</em><span>LEADERSHIP</span><small>- the invisible</small></div><div class="chips"><b>Mindset</b><b>Engagement</b><b>Motivation</b><b>Trust</b></div></div>' +
      '<p class="muted" style="margin-top:14px"><b>How present is each world in your day-to-day?</b> You do this walk together, but each of you answers only for yourself. It takes about 20 minutes. You pick a change you are involved in, answer five short rounds taking turns, and talk about it as you walk.</p>' +
      '<label class="field"><span class="dot" style="background:var(--a)"></span>Name of person A' +
        '<input id="nA" type="text" autocomplete="given-name" maxlength="24" value="' + esc(S.names[0]) + '" placeholder="e.g. Anna"></label>' +
      '<label class="field"><span class="dot" style="background:var(--b)"></span>Name of person B' +
        '<input id="nB" type="text" autocomplete="given-name" maxlength="24" value="' + esc(S.names[1]) + '" placeholder="e.g. Jonas"></label>' +
      '<button class="btn" data-act="start">Continue</button>' +
      '<p class="small" style="margin-top:14px">A reflection tool, not a validated test. Nothing leaves this phone.</p>' +
    '</main>' + BAL;
  }

  function viewAnchor(){
    return '<main>' +
      '<h2>Pick a change</h2>' +
      '<p>Think of a change you are involved in right now, as a leader or as someone affected by it. Tell the other person about it in two sentences, then note it below in a few words.</p>' +
      '<p class="muted">All your answers will refer to this change. You decide how much to share.</p>' +
      '<label class="field"><span class="dot" style="background:var(--a)"></span>' + esc(nm(0)) + '\'s change' +
        '<input id="aA" type="text" maxlength="50" value="' + esc(S.anchor[0]) + '" placeholder="e.g. New operating model for my department"></label>' +
      '<label class="field"><span class="dot" style="background:var(--b)"></span>' + esc(nm(1)) + '\'s change' +
        '<input id="aB" type="text" maxlength="50" value="' + esc(S.anchor[1]) + '" placeholder="e.g. Rollout of a new system"></label>' +
      '<button class="btn" data-act="anchorgo">Start round 1</button>' +
    '</main>';
  }

  function scale(key, val){
    var h = '<div class="scale" role="group" aria-label="Rating from 1 to 5">';
    for(var v=1; v<=5; v++){
      h += '<button data-act="rate" data-key="' + key + '" data-v="' + v + '" aria-pressed="' + (val===v) + '">' + v + '</button>';
    }
    h += '</div><div class="ends"><span>1 = hardly</span><span>5 = very much</span></div>';
    return h;
  }

  function viewQuestion(){
    var p = who(S.round, S.turn), R = ROUNDS[S.round], a = S.ans[p][S.round];
    var ok = a.m!==null && a.l!==null;
    var pct = Math.round(((S.round*2 + S.turn) / (N*2)) * 100);
    return band(p, "Now answering", "Round " + (S.round+1) + " of " + N, pct) +
      '<main style="' + pcStyle(p) + '">' +
        '<div class="anchor">Your change: <b>' + esc(anc(p)) + '</b></div>' +
        '<div class="topic">' + esc(R.topic) + '</div>' +
        '<p class="muted" style="margin-bottom:0">With this change in mind: how much does each statement describe how you act?</p>' +
        '<div class="card m">' + tagHtml("m") + '<div class="stmt">' + esc(R.m) + '</div>' + scale("m",a.m) + '</div>' +
        '<div class="card l">' + tagHtml("l") + '<div class="stmt">' + esc(R.l) + '</div>' + scale("l",a.l) + '</div>' +
        '<button class="btn pc" data-act="next"' + (ok?'':' disabled') + '>' +
          (S.turn===0 ? 'Done, pass the phone on' : 'Done, show both answers') + '</button>' +
      '</main>';
  }

  function hand(p, line1, line2, act){
    return '<div class="handover" style="' + pcStyle(p) + '">' +
      '<p>' + line1 + '</p>' +
      '<div class="big">' + esc(nm(p)) + '</div>' +
      '<p>' + line2 + '</p>' +
      '<button class="btn" data-act="' + act + '">I am ' + esc(nm(p)) + ', continue</button>' +
    '</div>';
  }

  function viewHandover(){
    var p = who(S.round, 1), prev = who(S.round, 0);
    return hand(p, esc(nm(prev)) + ' is done. Please pass the phone to',
      esc(nm(prev)) + '\'s answers stay hidden until both of you have answered.', 'handover');
  }

  function viewReveal(){
    var R = ROUNDS[S.round], A = S.ans[0][S.round], B = S.ans[1][S.round];
    function line(k){
      return '<div class="card ' + k + '">' + tagHtml(k) + '<div class="stmt" style="font-size:16px">' + esc(R[k]) + '</div>' +
        '<div class="row"><span><span class="dot" style="background:var(--a)"></span>' + esc(nm(0)) + '</span><span class="pill a">' + A[k] + '</span></div>' +
        '<div class="row"><span><span class="dot" style="background:var(--b)"></span>' + esc(nm(1)) + '</span><span class="pill b">' + B[k] + '</span></div>' +
      '</div>';
    }
    var last = S.round === N-1;
    return '<main>' +
      '<div class="topic">Round ' + (S.round+1) + ' of ' + N + ' - ' + esc(R.topic) + '</div>' +
      '<h2>Your answers</h2>' +
      line("m") + line("l") +
      '<div class="prompt"><b>Start here:</b><br>Take turns and tell each other why you chose your numbers, with your own change in mind. There are no right or wrong ratings, and they are not meant to be compared.</div>' +
      '<div class="prompt"><b>Then, if you like:</b><br>' + esc(R.q) + ' <span class="small">Feel free to skip.</span></div>' +
      '<button class="btn" data-act="advance">' + (last ? 'See your own profile' : 'Next round: ' + esc(nm(who(S.round+1,0))) + ' starts') + '</button>' +
    '</main>';
  }

  function profileText(m,l){
    var d = m - l, hi = Math.min(m,l) >= 4, lo = Math.max(m,l) < 3;
    if(hi && Math.abs(d)<0.6) return "Both worlds are strongly present in your day-to-day and well balanced. Keep that balance when the pressure rises.";
    if(lo) return "Both worlds are still a small part of your day-to-day in this change. Pick one concrete lever per world for the coming weeks.";
    if(d >= 0.6) return "Tilted towards change management: structure, plans and control are strongly present. The invisible part below the waterline (mindset, motivation, engagement, trust) has more room.";
    if(d <= -0.6) return "Tilted towards change leadership: relationships, impact and mindset are strongly present. A bit more structure, planning and process would help that carry further.";
    return "Fairly balanced between the two worlds, at a medium level. The biggest gain lies in strengthening both sides deliberately.";
  }

  function bar(cls,label,val){
    return '<div class="bar"><div class="lab"><span>' + label + '</span><b>' + f1(val) + ' of 5</b></div>' +
      '<div class="track"><div class="fill ' + cls + '" style="width:' + (val/5*100) + '%"></div></div></div>';
  }

  function personCard(p){
    var ms = S.ans[p].map(function(x){return x.m;}), ls = S.ans[p].map(function(x){return x.l;});
    var m = avg(ms), l = avg(ls);
    var tot = S.ans[p].map(function(x,i){ return {i:i, v:x.m + x.l}; }).sort(function(a,b){return b.v-a.v;});
    var best = ROUNDS[tot[0].i].topic, low = ROUNDS[tot[N-1].i].topic;
    return '<div class="person" style="' + pcStyle(p) + '">' +
      '<h3>' + esc(nm(p)) + '</h3>' +
      bar("m","Change Management",m) + bar("l","Change Leadership",l) +
      '<p style="margin-top:12px">' + profileText(m,l) + '</p>' +
      '<p class="small" style="margin:0">Most present in your day-to-day: <b>' + esc(best) + '</b><br>Most room to grow: <b>' + esc(low) + '</b></p>' +
    '</div>';
  }

  function viewOwn(){
    var p = S.rp;
    return band(p, "Your own profile", "Only for you for now", 100) +
      '<main style="' + pcStyle(p) + '">' +
        '<p class="muted" style="margin-bottom:0">Read this on your own for a moment. It reflects your view of ' + esc(anc(p)) + '. It is not a score.</p>' +
        personCard(p) +
        '<div class="prompt"><b>Ask yourself:</b><br>Which part feels right, and which part surprises you?</div>' +
        '<button class="btn pc" data-act="ownnext">' + (p===0 ? 'Done, pass the phone on' : 'Done, continue') + '</button>' +
      '</main>';
  }

  function viewResHand(){
    return hand(1, esc(nm(0)) + ' has read the profile. Please pass the phone to',
      'Your own profile is next. ' + esc(nm(0)) + '\'s profile is not shown to you.', 'reshand');
  }

  function viewClosing(){
    return '<main>' +
      '<h2>Talk it over</h2>' +
      '<p class="muted">Now share as much of your own profile as you like. You both saw only your own.</p>' +
      '<div class="prompt"><b>First:</b><br>Share one thing in your profile that surprised you, and one thing that felt right.</div>' +
      '<div class="prompt"><b>Then:</b><br>What did you hear from the other person today that you would like to try yourself?</div>' +
      '<div class="prompt"><b>To close the walk:</b><br>What is one concrete thing you will do in the next four weeks to strengthen the world that is less present in your day-to-day? Who will remind you?</div>' +
      '<div class="note">Note: This is a self-assessment for reflection. The statements and the thresholds used for the interpretation are a draft and not scientifically validated.</div>' +
      '<button class="btn ghost" data-act="restart">Start over</button>' +
    '</main>' + BAL;
  }

  /* ---------- Render + events ---------- */
  function render(){
    var h = "";
    if(S.screen==="intro") h = viewIntro();
    else if(S.screen==="anchor") h = viewAnchor();
    else if(S.screen==="q") h = viewQuestion();
    else if(S.screen==="handover") h = viewHandover();
    else if(S.screen==="reveal") h = viewReveal();
    else if(S.screen==="own") h = viewOwn();
    else if(S.screen==="reshand") h = viewResHand();
    else if(S.screen==="closing") h = viewClosing();
    var top = '<header class="brandtop"><img src="' + LOGO_FF + '" alt="Future Finance"></header>';
    var bot = '<footer class="brandbot"><img src="' + LOGO_TUV + '" alt="T\u00dcV Rheinland - Precisely Right."><button class="link" data-act="restart">Start over</button></footer>';
    app.innerHTML = top + '<div class="body">' + h + '</div>' + bot;
    window.scrollTo(0,0);
    save();
  }

  app.addEventListener("input", function(e){
    if(e.target.id==="nA") S.names[0] = e.target.value;
    if(e.target.id==="nB") S.names[1] = e.target.value;
    if(e.target.id==="aA") S.anchor[0] = e.target.value;
    if(e.target.id==="aB") S.anchor[1] = e.target.value;
  });

  app.addEventListener("click", function(e){
    var t = e.target.closest("[data-act]");
    if(!t) return;
    var act = t.getAttribute("data-act");

    if(act==="start"){
      if(S.names[0].trim() && S.names[1].trim() && S.names[0].trim().toLowerCase()===S.names[1].trim().toLowerCase()){
        S.names[1] = S.names[1].trim() + " (B)";
      }
      S.screen = "anchor"; render();
    }
    else if(act==="anchorgo"){
      S.screen = "q"; S.round = 0; S.turn = 0; render();
    }
    else if(act==="rate"){
      var p = who(S.round, S.turn);
      S.ans[p][S.round][t.getAttribute("data-key")] = parseInt(t.getAttribute("data-v"),10);
      var y = window.scrollY; render(); window.scrollTo(0,y);
    }
    else if(act==="next"){
      S.screen = S.turn===0 ? "handover" : "reveal"; render();
    }
    else if(act==="handover"){
      S.turn = 1; S.screen = "q"; render();
    }
    else if(act==="advance"){
      if(S.round >= N-1){ S.screen = "own"; S.rp = 0; }
      else { S.round++; S.turn = 0; S.screen = "q"; }
      render();
    }
    else if(act==="ownnext"){
      if(S.rp===0){ S.screen = "reshand"; } else { S.screen = "closing"; }
      render();
    }
    else if(act==="reshand"){
      S.rp = 1; S.screen = "own"; render();
    }
    else if(act==="restart"){
      if(window.confirm("Reset everything and start over?")) reset();
    }
  });

  load();
  render();
})();
</script>
</body>
</html>
